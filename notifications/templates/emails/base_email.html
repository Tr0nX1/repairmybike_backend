<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 20px auto; border: 1px solid #eee; border-radius: 8px; overflow: hidden; }
        .header { background: #1a237e; color: #ffffff; padding: 20px; text-align: center; }
        .header img { max-width: 150px; margin-bottom: 10px; }
        .content { padding: 30px; }
        .footer { background: #f5f5f5; color: #777; padding: 20px; text-align: center; font-size: 12px; }
        .button { display: inline-block; padding: 12px 24px; background: #c62828; color: #ffffff; text-decoration: none; border-radius: 4px; font-weight: bold; margin-top: 20px; }
        .table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        .table th, .table td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        .highlight { color: #1a237e; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- Replace with actual logo URL -->
            <img src="https://repairmybike.in/assets/logo.png" alt="RepairMyBike Logo">
            <h1>RepairMyBike</h1>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            <p>&copy; 2026 RepairMyBike Service Center. All rights reserved.</p>
            <p>Support: support@repairmybike.in | Office: [Your Address Here]</p>
            <p><a href="https://repairmybike.in/policies/privacy-policy">Privacy Policy</a> | <a href="https://repairmybike.in/policies/terms-and-conditions">Terms & Conditions</a></p>
        </div>
    </div>
</body>
</html>
